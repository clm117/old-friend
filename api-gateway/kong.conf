# Kong Gateway配置文件

# 数据库配置
database = postgres
pg_host = localhost
pg_port = 5432
pg_user = kong
pg_password = kong
pg_database = kong

# 监听配置
proxy_listen = 0.0.0.0:8000
proxy_listen_ssl = 0.0.0.0:8443
admin_listen = 127.0.0.1:8001

# 插件配置
plugins = bundled,jwt,rate-limiting

# 日志配置
log_level = notice

# 其他配置
lua_ssl_trusted_certificate = /etc/ssl/certs/ca-certificates.crt
