global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8000']
  
  - job_name: 'ai-service'
    static_configs:
      - targets: ['ai-service:8080']
  
  - job_name: 'message-service'
    static_configs:
      - targets: ['message-service:8081']

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
