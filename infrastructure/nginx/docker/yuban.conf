# ============================================================
# 语伴 nginx 容器配置（Docker 版）
# 挂载到：/etc/nginx/conf.d/default.conf
# 上游：api-gateway 容器（compose 服务名:8005）
#
# 安全加固：
#   - server_tokens off        隐藏 nginx 版本
#   - 安全响应头                nosniff / frame / referrer / Permissions-Policy
#   - limit_req 请求限流        按客户端 IP 分桶，防刷防爆（登录接口单独降额）
#   - autoindex off            关闭目录列表，避免生成音频被枚举
# ============================================================

# ---- 限流区（http 上下文）----
limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=120r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=ws_limit:10m    rate=30r/m;

# ---- WebSocket 升级映射 ----
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       80;
    server_name  _;
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    # 音频上传（声音克隆参考音频等）
    client_max_body_size 50m;
    client_body_timeout   30s;
    client_header_timeout 15s;

    # ---- 安全响应头 ----
    # nosniff / X-Frame-Options / Referrer-Policy 三项网关也会对代理响应下发，
    # 为避免响应头重复，nginx 只在自身直出的静态资源处补齐（见 location / 与 /test_outputs/）。
    # Permissions-Policy 网关不提供，放在 server 层以便代理响应也能带上。
    # 前端需麦克风录音，仅放开自身来源；其余能力一律禁用
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    # ---- 前端静态文件（挂载项目 frontend/）----
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    }

    # ---- 测试音频试听（挂载项目 test_outputs/），关闭目录列表 ----
    location /test_outputs/ {
        alias /usr/share/nginx/test_outputs/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    # ---- 健康检查 ----
    location = /health {
        proxy_pass http://api-gateway:8005/health;
        proxy_set_header Host $host;
    }

    # ---- 登录接口单独限流（防口令爆破）；精确匹配优先于 /api/ 前缀 ----
    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://api-gateway:8005/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---- API 反代（TTS 合成慢，超时拉长到 10 分钟）----
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://api-gateway:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---- WebSocket 实时对话（/ws/chat/{session_id}）----
    location /ws/ {
        limit_req zone=ws_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://api-gateway:8005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
